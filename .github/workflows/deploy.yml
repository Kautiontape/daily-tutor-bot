name: Deploy to ktn

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, ktn]
    permissions:
      contents: read
      packages: read
    steps:
      # The build pulls ghcr.io/astral-sh/uv. Other ktn deploys leave their
      # job token in the runner's Docker config, and it is revoked when their
      # job ends, so log in fresh or ghcr answers "denied".
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Deploy
        run: |
          cd /opt/services/daily-tutor-bot
          git pull origin main
          docker compose build
          docker compose up -d

      # Every ktn deploy logs in with its job token, which is revoked when the
      # job ends; leaving it in the runner's Docker config makes the next job's
      # ghcr pulls fail with "denied".
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
